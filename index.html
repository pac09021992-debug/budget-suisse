<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOLDEO — Ton reste à vivre, simplement.</title>

<style>
:root{
  --bg:#f3f7ff;
  --card:#fff;
  --text:#182033;
  --muted:#737b8c;
  --line:#e4e9f3;
  --accent:#536dfe;
  --green:#20b26b;
  --red:#ef4444;
  --orange:#f59e0b;
  --blue:#26345a;
  --shadow:0 10px 30px rgba(30,50,90,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  padding:18px 16px 95px;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.logo{
  font-size:25px;
  font-weight:850;
  letter-spacing:-.5px;
  color:#26345a;
}
.month{
  font-size:13px;
  color:var(--muted);
}
.card{
  background:var(--card);
  border-radius:22px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.hero{
  background:linear-gradient(135deg,#26345a,#536dfe);
  color:#fff;
  border-radius:26px;
  padding:23px 20px;
  margin-bottom:14px;
}
.label{
  font-size:13px;
  opacity:.8;
}
.balance{
  font-size:38px;
  font-weight:850;
  margin:5px 0 2px;
  letter-spacing:-1px;
}
.hero small{opacity:.82}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.title{
  font-weight:750;
}
.muted{
  color:var(--muted);
}
.amount{
  font-weight:750;
}
.green{color:var(--green)}
.red{color:var(--red)}
.orange{color:var(--orange)}
.progress{
  height:10px;
  background:#edf0f6;
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
}
.progress>div{
  height:100%;
  background:linear-gradient(90deg,#20b26b,#43d39a);
  border-radius:99px;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.btn{
  border:0;
  border-radius:16px;
  padding:14px 12px;
  font-weight:750;
}
.primary{
  background:#536dfe;
  color:white;
}
.secondary{
  background:#edf1ff;
  color:#33458b;
}
.section-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
}
.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat{
  background:#f7f9fd;
  border-radius:17px;
  padding:13px;
}
.stat .v{
  font-size:19px;
  font-weight:800;
  margin-top:4px;
}
.nav{
  position:fixed;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:min(430px,calc(100% - 20px));
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:22px;
  padding:8px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:5px;
  box-shadow:0 10px 35px rgba(20,30,60,.14);
  z-index:20;
}
.navitem{
  border:0;
  background:transparent;
  border-radius:16px;
  padding:9px 4px;
  font-size:12px;
  color:var(--muted);
}
.navitem.active{
  background:#eef1ff;
  color:#26345a;
  font-weight:800;
}
.plus{
  font-size:22px;
  line-height:15px;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(10,20,40,.45);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}
.modal.show{display:flex}
.modalbox{
  width:min(430px,100%);
  background:white;
  border-radius:27px 27px 0 0;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}
.field{
  margin-bottom:13px;
}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}
.field input,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  background:white;
  color:var(--text);
}
.modalBtns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.list{
  display:flex;
  flex-direction:column;
}
.item{
  padding:13px 0;
  border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:0}
.smallbtn{
  border:0;
  border-radius:10px;
  padding:7px 9px;
  font-size:12px;
  font-weight:700;
  margin-left:5px;
}
.edit{background:#edf1ff;color:#33458b}
.delete{background:#fff0f0;color:#d33}
.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:13px;
}
.tab{
  border:0;
  background:#eef1f6;
  color:var(--muted);
  padding:9px 4px;
  border-radius:12px;
  font-size:12px;
  font-weight:700;
}
.tab.active{
  background:#26345a;
  color:#fff;
}
.dayrow{
  padding:13px 0;
  border-bottom:1px solid var(--line);
}
.dayrow:last-child{border-bottom:0}
.empty{
  text-align:center;
  padding:28px 10px;
  color:var(--muted);
}
.page{display:none}
.page.active{display:block}
h2{
  margin:4px 0 16px;
  font-size:23px;
}
.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:9px;
  background:#eef1ff;
  color:#33458b;
  font-size:11px;
  font-weight:700;
}
.danger{
  color:#d33;
}
</style>
</head>

<body>

<div class="app">

  <!-- ACCUEIL -->
  <main id="homePage" class="page active">

    <header>
      <div class="logo">SOLDEO</div>
      <div class="month" id="monthLabel"></div>
    </header>

    <section class="hero">
      <div class="label">Reste à vivre</div>
      <div class="balance" id="available">0.00 CHF</div>
      <small id="nextSalaryInfo">Aucun prochain salaire défini</small>
    </section>

    <section class="card">
      <div class="row">
        <div>
          <div class="title">Aujourd'hui</div>
          <div class="muted" id="todayDate"></div>
        </div>
        <div class="amount green" id="todayBudget">0.00 CHF</div>
      </div>
      <div class="muted" style="font-size:12px;margin-top:5
