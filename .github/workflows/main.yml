name: Build SOLDEO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Décompresser SOLDEO
        run: unzip -q soldeo-android-v1.zip -d .

      - name: Installer Capacitor
        working-directory: soldeo-android
        run: npm install

      - name: Ajouter Android
        working-directory: soldeo-android
        run: npx cap add android

      - name: Appliquer l'icône SOLDEO
        working-directory: soldeo-android
        run: |
          cat > soldeo-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#06264B"/>
              <stop offset="0.62" stop-color="#123D70"/>
              <stop offset="1" stop-color="#0A1A32"/>
            </linearGradient>
            <linearGradient id="sun" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#FFC34D"/>
              <stop offset="1" stop-color="#F47A20"/>
            </linearGradient>
            <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#00A98F"/>
              <stop offset="1" stop-color="#75F0B4"/>
            </linearGradient>
          </defs>

          <rect width="512" height="512" rx="112" fill="url(#bg)"/>

          <circle cx="397" cy="158" r="58" fill="#FF9C3A" opacity=".20"/>
          <circle cx="397" cy="158" r="36" fill="url(#sun)" opacity=".9"/>

          <path d="M45 315 L115 246 L168 279 L244 170 L305 237 L355 190 L468 315"
                fill="#0B3158"
                stroke="#F7FBFF"
                stroke-width="10"
                stroke-linejoin="round"/>

          <path d="M45 315 L115 246 L168 279 L244 170 L305 237 L355 190 L468 315"
                fill="none"
                stroke="#DCEBFA"
                stroke-width="5"
                stroke-linejoin="round"
                opacity=".9"/>

          <rect x="110" y="326" width="48" height="78" rx="12" fill="url(#bar)"/>
          <rect x="174" y="294" width="48" height="110" rx="12" fill="url(#bar)"/>
          <rect x="238" y="254" width="48" height="150" rx="12" fill="url(#bar)"/>
          <rect x="302" y="207" width="48" height="197" rx="12" fill="url(#bar)"/>

          <path d="M82 410 Q256 394 430 410"
                fill="none"
                stroke="#12D9B0"
                stroke-width="6"
                stroke-linecap="round"/>

          <text x="256" y="470"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="54"
                font-weight="800"
                letter-spacing="2"
                fill="white">SOLDEO</text>

          <circle cx="421" cy="450" r="19"
                  fill="none"
                  stroke="#FFB52E"
                  stroke-width="9"/>
          </svg>
          SVG

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          magick soldeo-icon.svg -background none -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          magick soldeo-icon.svg -background none -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          magick soldeo-icon.svg -background none -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          magick soldeo-icon.svg -background none -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          magick soldeo-icon.svg -background none -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Synchroniser SOLDEO
        working-directory: soldeo-android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: soldeo-android/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLDEO-APK
          path: soldeo-android/android/app/build/outputs/apk/debug/app-debug.apk
