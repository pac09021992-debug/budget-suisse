name: Build SOLDEO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Décompresser SOLDEO
        run: unzip -q soldeo-android-v1.zip -d .

      - name: Installer Capacitor
        working-directory: soldeo-android
        run: npm install

      - name: Ajouter Android
        working-directory: soldeo-android
        run: npx cap add android

      - name: Synchroniser SOLDEO
        working-directory: soldeo-android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: soldeo-android/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLDEO-APK
          path: soldeo-android/android/app/build/outputs/apk/debug/app-debug.apkname: Build SOLDEO APK

