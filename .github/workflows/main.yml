name: Build SOLDEO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Décompresser SOLDEO
        run: unzip -q soldeo-android-v1.zip -d .

      - name: Installer Capacitor
        working-directory: soldeo-android
        run: npm install

      - name: Ajouter Android
        working-directory: soldeo-android
        run: npx cap add android

      - name: Mettre à jour l'application SOLDEO
        run: |
          if [ -d "soldeo-android/www" ]; then
            cp index.html soldeo-android/www/index.html
          else
            echo "Dossier www introuvable"
            find soldeo-android -maxdepth 2 -type d
            exit 1
          fi

      - name: Créer l'icône SOLDEO
        working-directory: soldeo-android
        run: |
          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/drawable/soldeo_icon.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">

              <path
                  android:fillColor="#06264B"
                  android:pathData="M0,0 L512,0 L512,512 L0,512 Z"/>

              <path
                  android:fillColor="#123D70"
                  android:pathData="M40,330 L120,245 L175,280 L245,170 L310,238 L360,190 L475,330 Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M45,315 L115,246 L168,279 L244,170 L305,237 L355,190 L468,315 L460,323 L355,205 L305,250 L244,185 L168,293 L115,260 L55,323 Z"/>

              <path
                  android:fillColor="#00A98F"
                  android:pathData="M105,325 L155,325 L155,405 L105,405 Z"/>

              <path
                  android:fillColor="#35CFA7"
                  android:pathData="M170,292 L220,292 L220,405 L170,405 Z"/>

              <path
                  android:fillColor="#55E8B1"
                  android:pathData="M235,250 L285,250 L285,405 L235,405 Z"/>

              <path
                  android:fillColor="#75F0B4"
                  android:pathData="M300,205 L350,205 L350,405 L300,405 Z"/>

              <path
                  android:fillColor="#FF9C3A"
                  android:pathData="M360,120 A38,38 0,1 0,436,120 A38,38 0,1 0,360,120"/>
          </vector>
          XML

          sed -i 's#@mipmap/ic_launcher_round#@drawable/soldeo_icon#g' android/app/src/main/AndroidManifest.xml
          sed -i 's#@
