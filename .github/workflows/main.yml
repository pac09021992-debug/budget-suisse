name: Build SOLDEO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Décompresser SOLDEO
        run: unzip -q soldeo-android-v1.zip -d .

      - name: Installer Capacitor
        working-directory: soldeo-android
        run: npm install

      - name: Ajouter Android
        working-directory: soldeo-android
        run: npx cap add android

      - name: Mettre à jour l'application SOLDEO
        run: |
          if [ -d "soldeo-android/www" ]; then
            cp index.html soldeo-android/www/index.html
          else
            echo "Dossier www introuvable"
            find soldeo-android -maxdepth 2 -type d
            exit 1
          fi

      
      - name: Synchroniser SOLDEO
        working-directory: soldeo-android
        run: npx cap sync android
      - name: Installer le vrai logo Catogne
        working-directory: soldeo-android
        run: |
              sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert ../soldeo_icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert ../soldeo_icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert ../soldeo_icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert ../soldeo_icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert ../soldeo_icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Construire l'APK
        working-directory: soldeo-android/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLDEO-APK
          path: soldeo-android/android/app/build/outputs/apk/debug/app-debug.apk
