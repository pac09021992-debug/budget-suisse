name: Build SOLDEA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Préparer le projet SOLDEA
        run: |
          mkdir -p soldeo-android/www
          cp index.html soldeo-android/www/index.html

          cat > soldeo-android/package.json <<'EOF'
          {
            "name": "soldea-android",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo SOLDEA"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/filesystem": "6.2.2",
              "@capacitor/share": "6.2.2"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          EOF

          cat > soldeo-android/capacitor.config.json <<'EOF'
          {
            "appId": "ch.soldea.budget",
            "appName": "SOLDEA",
            "webDir": "www"
          }
          EOF

      - name: Installer Capacitor
        working-directory: soldeo-android
        run: npm install

      - name: Ajouter Android
        working-directory: soldeo-android
        run: npx cap add android

      - name: Définir le nom SOLDEA
        working-directory: soldeo-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/res/values/strings.xml")
          s = p.read_text()
          s = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">SOLDEA</string>',
              s
          )
          p.write_text(s)

          m = Path("android/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="@string/app_name"',
              s
          )
          m.write_text(s)
          PY

      - name: Installer le logo SOLDEA
        working-directory: soldeo-android
        run: |
          test -f ../soldea_icon.png
          sudo apt-get update
          sudo apt-get install -y imagemagick

          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/mipmap-$density"
            convert "../soldea_icon.png" -resize "${size}x${size}" \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Synchroniser SOLDEA
        working-directory: soldeo-android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: soldeo-android/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLDEA-APK
          path: soldeo-android/android/app/build/outputs/apk/debug/app-debug.apk
