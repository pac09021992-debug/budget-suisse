name: Build SOLDEO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Décompresser SOLDEO
        run: unzip -q soldeo-android-v1.zip -d .

      - name: Installer Capacitor
        working-directory: soldeo-android
        run: npm install

      - name: Ajouter Android
        working-directory: soldeo-android
        run: npx cap add android

      - name: Mettre à jour l'application SOLDEO
        run: |
          if [ -d "soldeo-android/www" ]; then
            cp index.html soldeo-android/www/index.html
          else
            echo "Dossier www introuvable"
            find soldeo-android -maxdepth 2 -type d
            exit 1
          fi

      -       - name: Installer le vrai logo Catogne
        working-directory: soldeo-android
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp ../soldeo_icon.png android/app/src/main/res/drawable/soldeo_icon.png
          sed -i 's#@mipmap/ic_launcher_round#@drawable/soldeo_icon#g' android/app/src/main/AndroidManifest.xml
          sed -i 's#@mipmap/ic_launcher#@drawable/soldeo_icon#g' android/app/src/main/AndroidManifest.xml
      - name: Synchroniser SOLDEO
        working-directory: soldeo-android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: soldeo-android/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLDEO-APK
          path: soldeo-android/android/app/build/outputs/apk/debug/app-debug.apk
